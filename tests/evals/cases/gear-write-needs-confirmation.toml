# Matériel Garmin (#133) : jamais d'écriture côté Garmin sans confirmation. L'athlète
# déclare en chat une paire QUI PORTE un `garmin: <uuid>` (Salomon S/Lab, fixture `gear-sync/`),
# la montre n'a attaché aucun matériel (texte réel « No gear data found… » du stub par défaut) :
# le coach attribue localement (`gear_id: slab`, `gear_source: chat`), PROPOSE de pousser vers
# Garmin sous forme de QUESTION, et n'appelle PAS `add_gear_to_activity` tant que l'athlète n'a
# rien confirmé (une paire sans uuid — Speedgoat — ne se pousse jamais, voir `agents/coach.md`).
#
# `must_match` : proposition à la forme interrogative visant Garmin (verbe de proposition à la
# 2ᵉ personne près de « Garmin », ou verbe d'action + Garmin + « ? »). Un « confirmé »/« confirme »
# nu ne suffit PAS (« chaussure confirmée » n'est pas une demande).
id = "gear-write-needs-confirmation"
prompt = "Synchronise ma dernière séance (la sortie longue d'avant-hier). Je l'ai faite avec mes Salomon S/Lab."
fixture = "gear-sync"

[expect]
files_with_arc_block = ["activities/*.md"]
tools_not_called = ["add_gear_to_activity"]
must_match = [
  "((veux-tu|voulez-vous|souhaites-tu|souhaitez-vous|d[ée]sires-tu)[^\\n]{0,140}Garmin)|(Garmin[^\\n]{0,140}(veux-tu|voulez-vous|souhaites-tu|souhaitez-vous))|((attach|pouss|report|envoy)[^\\n]{0,80}Garmin[^\\n]{0,80}\\?)",
]

[[expect.arc_field]]
glob = "activities/*.md"
path = "gear_id"
equals = "slab"

[[expect.arc_field]]
glob = "activities/*.md"
path = "gear_source"
equals = "chat"
