# Story #65, variante panne : les outils de pré-remplissage tombent en
# erreur (token expiré, #26 `error = "401"`) — l'entretien doit retomber
# SILENCIEUSEMENT sur les questions classiques du modèle, sans jamais montrer
# le texte d'erreur brut ni inventer de valeur à la place de ce que Garmin
# n'a pas pu rendre (`skills/coach-setup/SKILL.md` § 4.a).
id = "setup-prefill-garmin-error"
prompt = """
/coach-setup

Pour aller vite, voici mes réponses à toutes les questions de configuration
que tu comptes me poser, dans l'ordre où le script les liste : style factuel,
fermeté équilibrée, longueur brève, discipline trail, aucun sport croisé,
staff coach seul, bilan matinal complet, langue des documents français,
langue des réponses auto, unités métriques. Écris-les sans me les reposer.

Ensuite, propose-moi de remplir mon profil physiologique en allant chercher ce
que tu peux sur Garmin.
"""
fixture = "empty"

[stub.garmin.get_activities_by_date]
error = "401"

[stub.garmin.get_stats]
error = "401"

[stub.garmin.get_lactate_threshold]
error = "401"

[stub.garmin.get_training_status]
error = "401"

[expect]
tools_called = ["get_activities_by_date", "get_stats", "get_lactate_threshold", "get_training_status"]
files_created = ["planning/Runner_Profile.md", "config/workspace.user.toml"]
max_words = 450
# Panne invisible : ni le texte d'erreur brut du stub
# (mcp_stub_common.auth_expired_text), ni aucune valeur inventée — le coach
# repose la question classique à la place (fallback silencieux, § 4.a).
must_not_match = ["401", "Unauthorized", "Authentication failed"]
must_match = ["fc max|fréquence cardiaque|fc de repos|fc au seuil"]

# Les deux champs que Garmin n'a pas pu fournir restent EXACTEMENT tels que
# `--scaffold`/`--apply` les ont installés depuis le modèle — aucune valeur
# n'a été écrite à leur place. « FC max » n'a jamais de commentaire dans le
# modèle (ligne vide suivie directement d'un retour à la ligne) ; « FC au
# seuil » garde son commentaire d'aide d'origine (mot-clé propre au modèle,
# jamais réécrit) tant qu'il n'a jamais été rempli. Ancré sur « : <!-- fc
# tenue » (colon SUIVI DIRECTEMENT du commentaire, sans valeur entre les
# deux) plutôt que sur le simple mot « seuil lactique » (revue de code #112,
# 2ᵉ tour) : `coach_setup.py` conserve désormais le commentaire d'aide APRÈS
# une valeur écrite (`- **FC au seuil** : 168 <!-- ... -->`), donc l'ancienne
# assertion resterait vraie même si la valeur avait été (incorrectement)
# écrite — elle ne prouvait plus rien.
[[expect.file_contains_any]]
glob = "planning/Runner_Profile.md"
any = ["**fc max** :\n"]

[[expect.file_contains_any]]
glob = "planning/Runner_Profile.md"
any = ["fc au seuil** : <!-- fc tenue"]
