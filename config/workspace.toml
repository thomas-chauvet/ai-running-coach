# Configuration de l'espace de travail ai-running-coach
#
# Ce fichier est VERSIONNÉ : il contient les valeurs par défaut partagées.
# Pour des overrides personnels, créez `config/workspace.user.toml`
# (gitignoré) avec la même structure — ses valeurs priment.

[language]
# Langue des fichiers Markdown persistés par les agents/skills
# (activities/, medical/, nutrition/, planning/, rapports/).
# Valeurs : code ISO 639-1 (ex. "fr", "en", "nl").
documents = "fr"

# Langue des réponses à l'utilisateur.
# "auto" = même langue que la requête de l'utilisateur.
responses = "auto"

[notifications]
# Notification push envoyée après chaque synchronisation automatique
# (scripts/daily-sync.sh → scripts/notify.sh), dans la conversation Telegram du
# coach (même bot que le chat, voir [telegram]). Configurez-la avec
# `scripts/setup-telegram.sh` (écrit les overrides dans workspace.user.toml).
# Valeurs : "telegram" | "none".
provider = "none"
# Votre ID numérique Telegram. Vide : premier compte appairé du bot
# (~/.claude/channels/telegram/access.json).
telegram_chat_id = ""
# Fichier contenant le token du bot. Vide : ~/.claude/channels/telegram/.env,
# écrit par /telegram:configure. Jamais versionné.
telegram_token_file = ""

[telegram]
# Chat avec le coach depuis Telegram (Claude Code Channels) : session permanente
# gérée par `scripts/coach-telegram.sh install` (voir docs/mobile.md).
# Mode de permission de la session. Les outils autorisés sont fusionnés depuis
# templates/settings.telegram.json dans .claude/settings.local.json.
permission_mode = "acceptEdits"
# Heure locale du redémarrage quotidien (contexte neuf). "" pour désactiver.
daily_restart = "03:30"

[sync]
# Synchronisation Garmin automatique (voir docs/mobile.md et scripts/daily-sync.sh).
# Exécuteur headless : "claude" (Claude Code, `claude -p`) | "codex" (Codex CLI, `codex exec`).
runner = "claude"
# Heures locales de lancement (cron/launchd) — installées par `./install.sh --daily-sync`.
# Défaut : après la nuit (sommeil/HRV synchronisés) et après la sortie du midi.
times = ["07:15", "14:15"]
# Nombre de jours à vérifier (aujourd'hui inclus) — seuls les fichiers MD manquants sont récupérés.
lookback_days = 2
# Après chaque run, `git add -A && git commit && git push` dans le workspace s'il est
# un dépôt git (données de la sync + fichiers créés par les sessions mobiles).
# À activer dans workspace.user.toml quand le workspace est votre dépôt privé
# (voir docs/workspace.md). Le push exige un remote accessible sans mot de passe (clé SSH).
git_autocommit = false

[integrations]
# Repérage automatique des PR de segments Strava (skill `strava-highlights`) après
# chaque séance persistée par garmin-daily-sync — plié dans la ligne "Séances" de la
# notification, jamais une alerte. Strava reste TERTIAIRE (voir AGENTS.md) : jamais
# une source de persistance des données brutes d'activité. Se dégrade silencieusement
# si le connecteur claude.ai Strava est indisponible, non autorisé, ou injoignable en
# mode cron non interactif — aucun impact sur le sync Garmin lui-même.
strava_highlights = true

[athlete]
# Profil de l'athlète : fichier Markdown libre, dans votre workspace, jamais
# versionné dans le dépôt public. Créé par `/coach-setup` depuis
# `templates/Runner_Profile.template.md`.
profile = "planning/Runner_Profile.md"
# Unités des distances, allures et poids. Valeurs : "metric" | "imperial".
units = "metric"

[sport]
# Discipline principale — détermine le profil chargé depuis `config/sports/`.
# Valeurs : "trail" | "road".
primary = "trail"
# Sports croisés pratiqués, pour la planification hebdomadaire.
# Ex. ["cycling", "swimming", "strength"].
disciplines = []

[agents]
# Agents installés et joignables. Retirez-en pour alléger votre staff : le coach
# ne délègue qu'aux agents listés ici, et `./install.sh` n'installe que ceux-là.
# `./install.sh --no-medical` ou `--agents coach,nutritionist` écrit cette clé.
enabled = ["coach", "medical", "nutritionist", "course-strategist"]

[coaching]
# Comment le coach vous parle. Voir `config/coaching-styles.md` pour ce que
# chaque valeur implique concrètement.
# Valeurs : "bienveillant" | "exigeant" | "factuel" | "pedagogue".
style = "bienveillant"
# Avec quelle force le style s'applique. Valeurs : "gentle" | "balanced" | "strong".
intensity = "balanced"
# Longueur des retours et des rapports. Valeurs : "brief" | "standard" | "detailed".
verbosity = "standard"

[health]
# Bilan matinal avant toute décision de séance.
#   "full"    — le triptyque HRV + FC de repos + readiness (défaut, recommandé)
#   "minimal" — readiness seule, sans analyse HRV/FC de repos
#   "off"     — aucun filtrage santé : le coach planifie sur la charge
#               d'entraînement et votre ressenti déclaré
# Passer à "minimal" ou "off" si votre montre ne mesure pas la HRV, ou si vous
# ne souhaitez pas que l'entraînement soit conditionné à ces données.
morning_check = "full"

[dashboard]
# Tableau de bord local (`scripts/dashboard.sh`) : lecture seule, n'écoute que sur
# 127.0.0.1 — l'adresse n'est volontairement pas configurable. Si le port est pris,
# les 9 suivants sont essayés.
port = 8765
